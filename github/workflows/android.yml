name: Compilar app Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Empaquetar la parte web
        run: npm run build

      - name: Crear y sincronizar el proyecto Android
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Ajustes de Android (permisos de huella y notificaciones, iconos y número de versión)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q USE_BIOMETRIC "$M" || sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|&\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />|' "$M"
          grep -q POST_NOTIFICATIONS "$M" || sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|&\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />|' "$M"
          R=android/app/src/main/res
          mkdir -p "$R/drawable" && cp resources/android/drawable/*.xml "$R/drawable/"
          rm -rf "$R"/mipmap-anydpi-v26 "$R"/mipmap-anydpi
          for d in resources/android/mipmap-*; do mkdir -p "$R/$(basename "$d")"; cp "$d"/*.png "$R/$(basename "$d")/"; done
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle || true

      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar APK de prueba (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Compilar APK de producción (release)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Firmar el APK de producción
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out gestionauy.apk aligned.apk
          rm -f release.jks

      - name: Guardar APK firmado
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk-firmado
          path: gestionauy.apk
